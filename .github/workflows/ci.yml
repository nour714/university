name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest

    env:
      NODE_ENV: test
      DATABASE_URL_OWNER: postgres://postgres:postgres@localhost:5434/postgres?sslmode=disable
      DATABASE_URL_APP: "postgres://academic_app:test_app_pass_32_chars_minimum@localhost:5434/postgres?sslmode=disable"
      DATABASE_URL_GRADER: "postgres://academic_grader:test_grader_pass_32_chars_minimum@localhost:5434/postgres?sslmode=disable"
      APP_SECRET: "test_app_secret_32_characters_minimum_length"
      CODE_PEPPER: "test_code_pepper_32_characters_minimum_length"
      CRON_SECRET: "test_cron_secret_16_min"
      DB_SSL: disable
      DB_POOL_MAX: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Production Dependency Security Audit
        run: npm audit --audit-level=high --omit=dev

      - name: Install Gitleaks
        run: |
          GITLEAKS_VERSION="8.24.0"
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | sudo tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Run Gitleaks secrets detection
        run: gitleaks detect --source . --redact --verbose --no-banner

      - name: Repo Hygiene & Secrets Scan
        run: npx vitest run test/hygiene.test.ts

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Next.js Production Build
        run: npm run build

      - name: Run Vitest Automated Test Suite
        run: npm test

      - name: Run Mutation Checks (8 Targeted Regressions)
        run: npm run mutation-check

  e2e:
    runs-on: ubuntu-latest
    needs: verify

    env:
      NODE_ENV: test
      E2E_HTTP_ONLY: "1"
      DATABASE_URL_OWNER: postgres://postgres:postgres@localhost:5434/postgres?sslmode=disable
      DATABASE_URL_APP: "postgres://academic_app:test_app_pass_32_chars_minimum@localhost:5434/postgres?sslmode=disable"
      DATABASE_URL_GRADER: "postgres://academic_grader:test_grader_pass_32_chars_minimum@localhost:5434/postgres?sslmode=disable"
      APP_SECRET: "test_app_secret_32_characters_minimum_length"
      CODE_PEPPER: "test_code_pepper_32_characters_minimum_length"
      CRON_SECRET: "test_cron_secret_16_min"
      DB_SSL: disable
      DB_POOL_MAX: 5
      PORT: 5500

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Next.js Production Build
        run: npm run build || npm run build

      - name: Run Playwright E2E & Accessibility Tests
        run: npx playwright test

      - name: Upload Playwright Test Artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
