<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="50%" stop-color="#172554" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Ring -->
  <circle cx="100" cy="100" r="96" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="4" />
  <circle cx="100" cy="100" r="90" fill="none" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="4 2" opacity="0.6" />

  <!-- Neural Nodes / AI Constellation Circuit -->
  <g stroke="url(#cyanGrad)" stroke-width="1.2" opacity="0.75">
    <line x1="100" y1="36" x2="68" y2="60" />
    <line x1="100" y1="36" x2="132" y2="60" />
    <line x1="68" y1="60" x2="52" y2="98" />
    <line x1="132" y1="60" x2="148" y2="98" />
    <line x1="52" y1="98" x2="72" y2="136" />
    <line x1="148" y1="98" x2="128" y2="136" />
    <line x1="72" y1="136" x2="100" y2="152" />
    <line x1="128" y1="136" x2="100" y2="152" />
    <!-- Cross links -->
    <line x1="68" y1="60" x2="132" y2="60" />
    <line x1="52" y1="98" x2="148" y2="98" />
    <line x1="100" y1="36" x2="100" y2="98" />
  </g>

  <!-- Constellation Nodes -->
  <g fill="url(#goldGrad)" filter="url(#glow)">
    <circle cx="100" cy="36" r="4.5" />
    <circle cx="68" cy="60" r="4" fill="#38bdf8" />
    <circle cx="132" cy="60" r="4" fill="#38bdf8" />
    <circle cx="52" cy="98" r="4" fill="#38bdf8" />
    <circle cx="148" cy="98" r="4" fill="#38bdf8" />
    <circle cx="72" cy="136" r="4" fill="#38bdf8" />
    <circle cx="128" cy="136" r="4" fill="#38bdf8" />
    <circle cx="100" cy="152" r="4.5" />
    <circle cx="100" cy="98" r="5" />
  </g>

  <!-- Central Academic Crest: Graduation Cap -->
  <g fill="url(#goldGrad)" stroke="#172554" stroke-width="1.5">
    <!-- Cap Diamond Top -->
    <polygon points="100,74 136,88 100,102 64,88" />
    <!-- Cap Skull Cap Underneath -->
    <path d="M 76,93 L 76,108 C 76,116 124,116 124,108 L 124,93 Z" fill="url(#goldGrad)" />
    <!-- Tassel -->
    <path d="M 100,88 L 138,104 L 140,118" fill="none" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round" />
    <circle cx="140" cy="120" r="2.5" fill="#f59e0b" />
  </g>

  <!-- Open Book Symbol of Learning at the Base -->
  <g fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 78,138 C 88,133 100,135 100,138 C 100,135 112,133 122,138 L 122,154 C 112,150 100,152 100,154 C 100,152 88,150 78,154 Z" fill="#1e3a8a" opacity="0.9" />
    <line x1="100" y1="138" x2="100" y2="154" stroke="url(#goldGrad)" stroke-width="2" />
  </g>
</svg>